  <!-- Cookie Consent Banner (Consent Mode v2) -->
  <div id="cookie-banner" role="dialog" aria-modal="true" aria-labelledby="cookie-title" style="display:none; position:fixed; bottom:20px; right:20px; max-width:400px; z-index:99999; background:rgba(255,255,255,0.98); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border:1px solid #e2e8f0; border-radius:16px; padding:18px 20px; box-shadow:0 20px 40px -15px rgba(15,23,42,0.18); font-family:Inter,system-ui,sans-serif; color:#1e293b; font-size:13px; line-height:1.5;">
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
      <span style="font-size:16px;">🍪</span>
      <strong id="cookie-title" style="font-size:14px; color:#0c2340;">Prywatność i cookies</strong>
    </div>
    <p style="margin:0 0 14px; color:#64748b; font-size:12.5px;">
      Używamy plików cookies i narzędzi analitycznych (Google Analytics 4), aby mierzyć ruch i optymalizować działanie strony. Więcej w <a href="/polityka-prywatnosci/" style="color:#0284c7; text-decoration:underline; font-weight:600;">Polityce prywatności</a>.
    </p>
    <div style="display:flex; gap:8px; justify-content:flex-end;">
      <button type="button" id="cookie-reject" style="background:#f1f5f9; color:#475569; border:none; border-radius:8px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer;">Tylko niezbędne</button>
      <button type="button" id="cookie-accept" style="background:#0284c7; color:#ffffff; border:none; border-radius:8px; padding:8px 16px; font-size:12px; font-weight:600; cursor:pointer;">Akceptuję</button>
    </div>
  </div>

  <script>
    (function() {
      try {
        var consent = localStorage.getItem('innova_cookie_consent_v2');
        if (!consent) {
          window.addEventListener('DOMContentLoaded', function() {
            var banner = document.getElementById('cookie-banner');
            if (banner) banner.style.display = 'block';

            var acceptBtn = document.getElementById('cookie-accept');
            if (acceptBtn) {
              acceptBtn.addEventListener('click', function() {
                localStorage.setItem('innova_cookie_consent_v2', 'granted');
                window.innovaSetAnalyticsConsent('granted');
                if (banner) banner.style.display = 'none';
              });
            }

            var rejectBtn = document.getElementById('cookie-reject');
            if (rejectBtn) {
              rejectBtn.addEventListener('click', function() {
                localStorage.setItem('innova_cookie_consent_v2', 'denied');
                window.innovaSetAnalyticsConsent('denied');
                if (banner) banner.style.display = 'none';
              });
            }
          });
        }
      } catch (e) {}
    })();
  </script>
